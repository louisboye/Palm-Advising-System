<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#123c35">
    <title>Accept Adviser Invitation | Palm Advising</title>
    <style>
      :root{font:16px/1.5 "Segoe UI",system-ui,sans-serif;color:#172a27;background:#f5f8f6}
      *{box-sizing:border-box}
      body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px}
      main{width:min(100%,440px);padding:32px;background:#fff;border:1px solid #e1e9e5;border-radius:16px;box-shadow:0 12px 40px #193c2e12}
      .eyebrow{margin:0 0 8px;color:#52786c;font-size:.72rem;font-weight:700;letter-spacing:.12em}
      h1{margin:0;font-size:1.75rem;letter-spacing:-.03em}
      p{color:#60716c}
      label{display:block;margin:20px 0 5px;font-size:.88rem;font-weight:650}
      input{width:100%;padding:11px 12px;border:1px solid #d5e0db;border-radius:8px;font:inherit}
      input:focus{outline:3px solid #c9ead9;border-color:#43826d}
      button{width:100%;margin-top:20px;padding:12px;border:0;border-radius:8px;background:#1e6352;color:#fff;font:inherit;font-weight:700;cursor:pointer}
      button:disabled{opacity:.65;cursor:wait}
      #message{min-height:24px;margin-bottom:0;font-size:.9rem}
      #message.error{color:#a83d35}
      #message.success{color:#20704f}
      .hint{font-size:.78rem}
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">PALM ACADEMIC ADVISING</p>
      <h1>Set up your adviser account</h1>
      <p>Create a password to accept your invitation. Use at least 12 characters.</p>
      <form id="invitation-form">
        <label for="password">New password</label>
        <input id="password" name="password" type="password" minlength="12" maxlength="72"
               autocomplete="new-password" required>
        <label for="confirm-password">Confirm password</label>
        <input id="confirm-password" name="confirmPassword" type="password" minlength="12" maxlength="72"
               autocomplete="new-password" required>
        <button id="submit-button" type="submit">Activate adviser account</button>
      </form>
      <p id="message" role="status" aria-live="polite"></p>
      <p class="hint">Invitation links expire after 48 hours and can only be used once.</p>
    </main>
    <script>
      const form = document.querySelector("#invitation-form");
      const message = document.querySelector("#message");
      const submit = document.querySelector("#submit-button");
      const token = new URLSearchParams(location.search).get("token");

      if (!token) {
        form.hidden = true;
        message.textContent = "This invitation link is missing its token. Ask an administrator to send a new invitation.";
        message.className = "error";
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        message.textContent = "";
        message.className = "";
        const password = form.elements.password.value;
        if (password !== form.elements.confirmPassword.value) {
          message.textContent = "The passwords do not match.";
          message.className = "error";
          return;
        }

        submit.disabled = true;
        try {
          const response = await fetch("/api/auth/accept-invitation", {
            method: "POST",
            headers: { "Content-Type": "application/json", "Accept": "application/json" },
            body: JSON.stringify({ token, password }),
          });
          const result = await response.json();
          if (!response.ok) throw new Error(result.message || "The invitation could not be accepted.");
          form.hidden = true;
          message.textContent = "Your adviser account is active. You can now sign in to Palm Advising.";
          message.className = "success";
        } catch (error) {
          message.textContent = error.message || "The invitation could not be accepted. Try again or ask for a new link.";
          message.className = "error";
          submit.disabled = false;
        }
      });
    </script>
  </body>
</html>
