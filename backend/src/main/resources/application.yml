spring:
  application:
    name: palm-advising-api
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:false}
          starttls:
            enable: ${SMTP_STARTTLS:false}
  profiles:
    default: local
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/palm_advising}
    username: ${DB_USERNAME:palm}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  jackson:
    time-zone: UTC
server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
app:
  jwt:
    issuer: palm-advising
    secret: ${JWT_SECRET:}
    expiration: PT30M
  cors:
    allowed-origins: ${FRONTEND_ORIGINS:http://127.0.0.1:5500,http://localhost:5500}
  mail:
    from: ${MAIL_FROM:noreply@palm.edu.gh}
    verification-url: ${BACKEND_BASE_URL:http://localhost:8080}/api/auth/verify-email
    invitation-url: ${BACKEND_BASE_URL:http://localhost:8080}/accept-invitation.html
  bootstrap:
    admin:
      enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
      email: ${BOOTSTRAP_ADMIN_EMAIL:}
      password: ${BOOTSTRAP_ADMIN_PASSWORD:}
      full-name: ${BOOTSTRAP_ADMIN_FULL_NAME:System Administrator}
